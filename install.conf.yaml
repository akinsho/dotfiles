- defaults:
    link:
      create: true
      relink: true

- create:
    - ~/.ssh
    - ~/.config
    - ~/projects
    # Claude reads every .md here. Kept a real directory so machine-specific
    # rules can sit alongside the linked ones.
    - ~/.claude/rules

- clean: [ "~" ]

- link:
    ~/.dotfiles: ""
    # ~/.ssh/config: ssh/config # TODO: HOME ONLY
    # ~/.config/stylua: .config/stylua # TODO: HOME ONLY
    ~/.gitignore: git/.gitignore
    ~/.gitconfig: git/.gitconfig
    ~/.gitmessage: git/.gitmessage
    ~/.zshenv: .config/zsh/.zshenv
    ~/.config/tmux: .config/tmux
    ~/.config/zsh: .config/zsh
    ~/.config/nvim: .config/nvim
    ~/.config/ideavim: .config/ideavim
    ~/.config/ghostty: .config/ghostty
    ~/.config/kitty: .config/kitty
    ~/.config/lazygit: .config/lazygit
    ~/.config/karabiner: .config/karabiner
    ~/.config/aerospace: .config/aerospace
    ~/.config/rex: .config/rex
    # Linked file-by-file, not as a directory: Claude reads every .md in
    # ~/.claude/rules and other rules are written there by tooling.
    ~/.claude/rules/:
      glob: true
      path: .config/claude/rules/*.md
    ~/.claude/hooks/:
      glob: true
      path: .config/claude/hooks/*.sh
    ~/.Brewfile:
      if: "[ `uname` = Darwin ]"
      path: macos/Brewfile
    ~/Library/Application Support/lazygit/config.yml:
      if: "[ `uname` = Darwin ]"
      path: .config/lazygit/config.yml
    ~/Library/Application Support/com.mitchellh.ghostty/:
      if: "[ `uname` = Darwin ]"
      path: .config/ghostty/config

- shell:
    - [
        git submodule update --init --recursive,
        Installing submodules
      ]
    - [ cp -n ./git/config.template ~/.gitconfig.local ]
