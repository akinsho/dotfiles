#-------------------------------------------------------------------------------
#   TMUX CONFIG
#-------------------------------------------------------------------------------
# NOTE: this overrides specify terminal capabilities you are overriding within tmux,
# this should "normally" be "xterm-256color" or "tmux-256color" but in the case of
# kitty it should be "xterm-kitty" so the solution/workaround here is to use the
# value of $TERM. This might not work for all terminals.
# see:
# https://jdhao.github.io/2018/10/19/tmux_nvim_true_color/
# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.term
set -g default-terminal "${TERM}"
set -as terminal-features ",${TERM}:RGB"
set -as terminal-features 'xterm*:extkeys'
set -s extended-keys on
#-------------------------------------------------------------------------------
#  Terminal settings {{{1
#-------------------------------------------------------------------------------
# -> https://github.com/alacritty/alacritty/issues/1628
# References:
#   * https://github.com/neovim/neovim/pull/9097
#   * https://github.com/tmux/tmux/issues/1492
# Allow undercurls for terminals that support them.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Allow coloured undercurls for terminals that support them.
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
# kitty graphics protocol
set -gq allow-passthrough on
# }}}
#-------------------------------------------------------------------------------
#  Prefix {{{1
#-------------------------------------------------------------------------------
set-option -g prefix C-space
unbind-key C-b
bind-key C-space send-prefix

# quick pane cycling
unbind ^A
bind ^A select-pane -t :.+

bind a last-window

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
# super useful when using "grouped sessions" and multi-monitor setup
set-option -wg aggressive-resize on
set-option -sg escape-time 10
set-option  -g focus-events on
set-option  -g history-limit 100000
set-option  -g renumber-windows on

bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display "Reloaded!"

bind . next-layout

unbind z # unbind default zoom
bind Space resize-pane -Z
# }}}
#-------------------------------------------------------------------------------
#  Display {{{1
#-------------------------------------------------------------------------------
set-option    -g set-titles on
set-option    -g set-titles-string '❐ #S ● #I'
set-option    -g allow-rename on
set-option    -g pane-base-index 1
set-option    -g base-index 1
set-option    -g monitor-activity on
set-option   -sg repeat-time 600
set-option    -g display-time 1000
set-option    -g status-interval 5
set-option   -wg automatic-rename on
set-option    -g monitor-activity on
set-option    -g visual-activity off
# Disable tmux statusline on zooming into a pane
# @see https://gist.github.com/bartj3/6d3bd8efd2ceaf02d443
# set-hook -g after-resize-pane "if-shell \"tmux list-panes -F '#F' | grep -q Z\" \"set -g status off\" \"set -g status on\""
# }}}
#-------------------------------------------------------------------------------
#  Navigation {{{1
#-------------------------------------------------------------------------------
set-option -g mouse on

# Session picker, on the same command and mnemonic as the shell's ctrl-f binding.
# Bound under the prefix rather than in the root table so it does not shadow
# ctrl-f for full-screen programs in a pane, where it usually means page-forward.
# Falls back to tmux's own session prompt on hosts without sesh installed.
if-shell 'command -v sesh >/dev/null' \
  'bind C-f display-popup -h 90% -w 50% -E "sesh picker -i"' \
  "bind C-f command-prompt -p find-session 'switch-client -t %%'"
bind-key C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

bind '\' split-window -h -c '#{?pane_path,#{pane_path},#{pane_current_path}}'
bind - split-window -v -c '#{?pane_path,#{pane_path},#{pane_current_path}}'
unbind '"'
unbind %

setw -g mode-keys vi # set vi mode for copy mode
# more settings to make copy-mode more vim-like
bind Escape copy-mode
# setup 'v' to begin selection as in Vim
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi v send-keys   -X begin-selection
bind-key -T copy-mode-vi c-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys   -X copy-selection
if-shell '[[ $(uname -s) = Linux ]]' {
   bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
} {
   bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
}

# Synchronize all panes in a window
bind y setw synchronize-panes
# easier and faster switching between next/prev window
bind p previous-window
bind n next-window

# detach client
bind-key d detach
bind-key C-d detach

# Cycle to next pane
bind-key -r Tab select-pane -t :.+

# previous window
bind-key BSpace previous-window

# swap panes
bind-key -r J swap-pane -D
bind-key -r K swap-pane -U

unbind -T copy-mode-vi MouseDragEnd1Pane

# Smart pane switching with awareness of Vim splits.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'

bind-key P command-prompt -T target -p "send pane to:"   "join-pane -t '%%'"
bind-key W command-prompt -T target -p "send window to:" "move-window -t '%%'"
# }}}
#-------------------------------------------------------------------------------
#  Status Bar {{{1
#-------------------------------------------------------------------------------
bind-key b set-option status

# colour8 = the theme's own grey, so dim bits follow the terminal theme.
INACTIVE_FG_COLOR='colour8'
# Accent keyed off #{client_theme} (OSC 11): amber on dark (9.0:1 on #282c34),
# bronze on light (6.3:1 on white, vs 1.6:1 for the amber).
# Hex must be lowercase: '#F' would expand to the window-flags variable.
ACTIVE_FG_DARK_BG='#fac863'
ACTIVE_FG_LIGHT_BG='#8a5300'
ACTIVE_FG_COLOR="#{?#{==:#{client_theme},light},$ACTIVE_FG_LIGHT_BG,$ACTIVE_FG_DARK_BG}"
# Purple is unused elsewhere in the bar, so it reads only as "active".
# colour129 on light (4.9:1); colour141 on dark (5.2:1, vs 2.8:1 for 129).
BORDER_ACTIVE="#{?#{==:#{client_theme},light},colour129,colour141}"
BORDER_INACTIVE="#{?#{==:#{client_theme},light},colour251,#343d46}"

set-option -g status on
set-option -g status-position top
set-option -g status-style "fg=terminal,bg=terminal"
set-option -g status-justify centre

# NOTE: these use nested conditionals and "," and "}" must be escaped
search_icon="#{?window_active,#{?window_zoomed_flag,#[fg=blue],},} "
# Bracketed superscript, only when split; chained s|| maps digits (12 -> [¹²]).
pane_count="#{?#{>:#{window_panes},1},[#{s|0|⁰|;s|1|¹|;s|2|²|;s|3|³|;s|4|⁴|;s|5|⁵|;s|6|⁶|;s|7|⁷|;s|8|⁸|;s|9|⁹|:window_panes}],}"
status_items="#[default]#{?window_bell_flag,#[fg=red] ,}#{?window_activity_flag,✉️ ,}$search_icon"

# ram_fg_color emits its own #[fg=...], so it must precede the values it tints.
# That tag sets only a colour and clears no attributes, so the label's emphasis
# needs an explicit reset or it carries through to the reading.
ram="#[bold,italics]RAM:#[noitalics,nobold] #{ram_fg_color}#{ram_icon} #{ram_percentage}#[default]"

set -g status-left-length  80
set -g status-right-length 70
# Options -> ⧉ ❐
# A #[...] tag inside a #{?} is silently dropped, so styles go outside it.
# reverse = high contrast on any theme; prefix state shows as a glyph.
set -g status-left "#[reverse,bold] ❐ #S #{?client_prefix,● ,}#[default]"
# alternate date format "%a %d %b"
right_sep="#[default,dim,fg=#343d46]•"
set -g status-right "#[fg=$INACTIVE_FG_COLOR]%A, %d %b #[fg=blue,bold,underscore]%H:%M#[default] $right_sep $ram "

set-window-option -g window-status-style         "fg=$INACTIVE_FG_COLOR,dim"
set-window-option -g window-status-current-style "fg=$ACTIVE_FG_COLOR,bold"
label_dir="#{=/18/…:#{b:pane_current_path}}"
# Unstyled: #[default] resets to status-style, not to the window's own style.
label_sep=" · "
window_label="#{?automatic-rename,$label_dir$label_sep#{pane_current_command},#W}"
# underscore inline rather than in the style, so it spans the text only
set-window-option -g window-status-current-format " #[underscore]#I$pane_count. $window_label#[nounderscore] $status_items"
set-window-option -g window-status-format        " #I$pane_count. $window_label $status_items"
# 'default' adds nothing to the base style; 'none' would clear its attributes.
set-window-option -g window-status-activity-style default
set-window-option -g window-status-separator "#[fg=$INACTIVE_FG_COLOR]"

# tmux commandline styling
set-option -g message-style "fg=yellow,bg=terminal,bold,fill=terminal"
# styling when in command mode i.e. vi or emacs mode in tmux command line
set-option -g message-command-style "fg=green,bg=terminal,bold,blink,fill=terminal"
# styling for the search indicator
set-option -g mode-style bg=terminal,fg=brightgreen,bold
# }}}
#-------------------------------------------------------------------------------
#  Pane border {{{1
#-------------------------------------------------------------------------------
set-option        -g pane-active-border-style "fg=$BORDER_ACTIVE"
set-option        -g pane-border-style        "fg=$BORDER_INACTIVE"
set-option        -g pane-border-lines heavy
# colour = mark the active pane by its border colour alone. Not "off", which
# would drop the colour too, leaving the active pane unmarked.
set-option        -g pane-border-indicators colour
# A per-pane label line, so an unsplit pane still shows an active border.
# No #[...] in the format: the line takes its colour from the border style, which
# is what distinguishes the active pane's label from the rest.
set-option        -g pane-border-status top
# Prefer a title the program set over pane_current_command, which names the
# executable: tools launched through a shared wrapper all report the wrapper.
# tmux seeds pane_title with the hostname, so that value and an empty one both
# mean "nothing set a title" and fall back to the command.
#
# Shell integrations commonly report the working directory as the title, which is
# far too wide for a border, so a path-shaped title keeps only its last component.
folder_icon=""
# tmux seeds the title with the hostname, so that value is indistinguishable from
# one nothing has written to.
title_unset="#{||:#{==:#{pane_title},},#{==:#{pane_title},#{host_short}}}"
title_is_path="#{||:#{m:*/*,#{pane_title}},#{m:~*,#{pane_title}}}"
pane_label="#{?$title_unset,#{pane_current_command},#{?$title_is_path,$folder_icon #{b:pane_title},#{pane_title}}}"
set-option        -g pane-border-format " #{pane_index}. $pane_label "
# }}}
#-------------------------------------------------------------------------------
#  Plugins {{{1
#-------------------------------------------------------------------------------
# TODO:
# - Find an alternative to kitty hints kitten in tmux
#
#-------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sessionist'
#-------------------------------------------------------------------------------
# Saves and restores tmux sessions beyond system crashes and restarts
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Auto saves tmux environment and keeps tmux running
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
#-------------------------------------------------------------------------------
# Adds better bindings for switching windows,panes & resizing
set -g @plugin 'tmux-plugins/tmux-pain-control'
set-option -g @pane_resize "10"
#-------------------------------------------------------------------------------
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'timvw/tmux-assistant-resurrect'
#-------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tmux-open'
# Source of the #{ram_*} and #{cpu_*} statusline placeholders.
set -g @plugin 'tmux-plugins/tmux-cpu'
run-shell ~/.tmux/plugins/tpm/tpm
# }}}
#-----------------------------------------------------------------------------

# vim:foldmethod=marker ft=tmux
